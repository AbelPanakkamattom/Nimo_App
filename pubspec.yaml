name: nimo_app
description: "NIMO Chat App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 🎨 UI
  cupertino_icons: ^1.0.8

  # 🔥 SUPABASE
  supabase_flutter: ^2.5.6
  flutter_dotenv: ^6.0.1

  # 📸 IMAGE PICKER
  image_picker: ^1.0.7

  # 🎤 AUDIO RECORDING
  record: ^6.0.0

  # 🔊 AUDIO PLAYBACK
  just_audio: ^0.9.36

  # 📁 FILE PATH
  path_provider: ^2.1.2

  # 🌐 INTERNET CHECK
  connectivity_plus: ^6.0.5

  # 🔐 PERMISSIONS
  permission_handler: ^11.3.1

  # 📤 SHARE
  share_plus: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # 🎨 APP ICON
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/nimo_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/nimo_logo.png"