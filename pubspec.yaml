name: nimo_app
description: "NIMO Realtime Chat App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

# ==========================================================
# DEPENDENCIES
# ==========================================================
dependencies:
  flutter:
    sdk: flutter

  # ========================================================
  # UI
  # ========================================================
  cupertino_icons: ^1.0.8

  # ========================================================
  # SUPABASE & ENVIRONMENT VARIABLES
  # ========================================================
  supabase_flutter: ^2.5.6
  flutter_dotenv: ^6.0.1

  # ========================================================
  # FIREBASE PUSH NOTIFICATIONS
  # ========================================================
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.7
  flutter_local_notifications: ^21.0.0

  # ========================================================
  # GOOGLE GEMINI AI
  # ========================================================
  google_generative_ai: ^0.4.7

  # ========================================================
  # AUTHENTICATION
  # ========================================================
  google_sign_in: ^7.2.0

  # ========================================================
  # ZEGOCLOUD CALLING
  # ========================================================
  zego_uikit: ^2.28.1
  zego_uikit_prebuilt_call: ^4.23.3
  zego_uikit_signaling_plugin: ^2.8.21
  zego_zpns: ^2.8.0

  # ========================================================
  # MEDIA
  # ========================================================
  image_picker: ^1.1.2
  record: ^6.0.0
  just_audio: ^0.10.5
  file_picker: ^10.3.8
  video_player: ^2.9.2

  # ========================================================
  # FILE HANDLING
  # ========================================================
  path_provider: ^2.1.4
  path: ^1.9.0
  open_filex: ^4.7.0

  # ========================================================
  # INTERNET
  # ========================================================
  connectivity_plus: ^6.1.5
  http: ^1.2.2

  # ========================================================
  # PERMISSIONS
  # ========================================================
  permission_handler: ^12.0.1

  # ========================================================
  # SHARE
  # ========================================================
  share_plus: ^12.0.2

  # ========================================================
  # CACHED IMAGES
  # ========================================================
  cached_network_image: ^3.4.1

  # ========================================================
  # ANIMATIONS
  # ========================================================
  flutter_animate: ^4.5.0

  # ========================================================
  # DATE AND TIME
  # ========================================================
  intl: ^0.20.2

  # ========================================================
  # AUDIO WAVEFORM UI
  # ========================================================
  audio_waveforms: ^2.0.2

  # ========================================================
  # STATE MANAGEMENT
  # ========================================================
  provider: ^6.1.2

  # ========================================================
  # LINK HANDLING
  # ========================================================
  url_launcher: ^6.3.0

  # ========================================================
  # LOCAL STORAGE (DARK MODE SETTINGS)
  # ========================================================
  shared_preferences: ^2.5.3

# ==========================================================
# DEV DEPENDENCIES
# ==========================================================
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # ========================================================
  # APP ICON GENERATION
  # ========================================================
  flutter_launcher_icons: ^0.14.4

# ==========================================================
# FLUTTER CONFIGURATION
# ==========================================================
flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/images/nimo_logo.png
    - assets/images/google.png
    - assets/images/apple.png
    - assets/images/yahoo.png
    - assets/images/samsung.png
    - assets/images/outlook.png

# ==========================================================
# APP ICON CONFIGURATION
# ==========================================================
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/nimo_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/nimo_logo.png"
  remove_alpha_ios: true